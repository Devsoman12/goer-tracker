<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Goer Tracker</title>
  <style>
    :root { color-scheme: dark; --bg: #222639; --panel: #2c3048; --text: #e8e8f0; --muted: #a0a3b8; --accent: #bb99ff; }
    body { margin: 0; padding: 12px; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; }
    h1 { font-size: 16px; margin: 0 0 8px; }
    .time { background: var(--panel); border-radius: 8px; padding: 10px; margin-bottom: 10px; }
    .big { font-size: 20px; font-weight: 600; }
    .muted { color: var(--muted); font-size: 12px; }
    .row { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
    button { background: var(--panel); color: var(--text); border: 1px solid #44486a; border-radius: 6px; padding: 5px 9px; cursor: pointer; font: inherit; }
    button:hover { border-color: var(--accent); }
    button.main { background: var(--accent); color: #1b1b2b; border-color: var(--accent); font-weight: 600; }
    input[type=number] { width: 70px; background: var(--panel); color: var(--text); border: 1px solid #44486a; border-radius: 6px; padding: 4px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    td { padding: 3px 4px; border-bottom: 1px solid #33374f; }
    .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 4px; }
    #msg { min-height: 18px; color: #ffcf70; font-size: 12px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <h1>Goer Tracker</h1>
  <div class="time">
    <div class="big" id="clock">…</div>
    <div class="muted" id="phase"></div>
  </div>
  <div id="gm" class="hidden">
    <div class="row">
      <button data-h="-24">−1 day</button>
      <button data-h="1">+1 h</button>
      <button data-h="6">+6 h</button>
      <button data-h="24">+1 day</button>
      <button data-h="168">+7 days</button>
      <button data-h="720">+30 days</button>
    </div>
    <div class="row">
      Day <input type="number" id="setDay" min="1"> hour <input type="number" id="setHour" min="0" max="23">
      <button id="go">Set</button>
    </div>
    <div class="row">
      <button id="useMap">Use selected map</button>
      <button id="sync" class="main">Place / update tokens</button>
      <button id="remove">Remove tokens</button>
    </div>
    <div class="row"><label><input type="checkbox" id="nightOverlay"> darken the map at night</label></div>
    <div id="msg"></div>
    <table id="list"></table>
    <p class="muted">Tokens are hidden from players unless "show" is ticked. Off the map = the Goer is on the part of its loop outside this map.</p>
  </div>
  <script type="module" src="main.js"></script>
</body>
</html>
